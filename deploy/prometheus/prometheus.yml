# =============================================================================
# Gargoyle API Gateway - Prometheus Metrics Scrape Configuration
# =============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'gargoyle_gateway'
    static_configs:
      - targets: ['gargoyle:8080']
        labels:
          environment: 'production'
          service: 'gargoyle-api-gateway'
